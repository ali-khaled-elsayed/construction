# =============================================================================
# Nginx — reverse proxy for Construction Marketplace
#
# Port 8000: Laravel API, Filament admin (/admin), storage, health (/up)
# Port 80:    Unified entry — backend routes + Next.js frontend
# =============================================================================

# Upstream for Next.js (hot reload WebSocket support in development)
upstream nextjs_frontend {
    server frontend:3000;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# Server block — Laravel API & Filament (host port 8000)
# -----------------------------------------------------------------------------
server {
    listen 8000;
    server_name _;

    # Document root must match PHP-FPM container path
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    include /etc/nginx/snippets/security-headers.conf;

    # Health check (Laravel 11 built-in route)
    location = /up {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API routes (prefix /api)
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Filament admin panel
    location /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire / Filament assets under /livewire, /css, /js if needed
    location ~ ^/(livewire|css|js|vendor) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Public uploads (storage/app/public — mounted as a volume in compose)
    location /storage {
        alias /var/www/html/storage/app/public;
        expires 30d;
        access_log off;
    }

    # Deny hidden files except .well-known (ACME)
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include /etc/nginx/snippets/fastcgi-php.conf;
    }

    location ~ /\.ht {
        deny all;
    }
}

# -----------------------------------------------------------------------------
# Server block — unified app (host port 80)
# Proxies frontend; passes API/admin/storage to Laravel
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    include /etc/nginx/snippets/security-headers.conf;

    # Laravel routes — same as :8000 server
    location = /up {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage {
        alias /var/www/html/storage/app/public;
        expires 30d;
        access_log off;
    }

    location ~ ^/(livewire|css|js|vendor) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include /etc/nginx/snippets/fastcgi-php.conf;
    }

    # Next.js — all other requests
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
