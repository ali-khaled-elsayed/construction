; =============================================================================
; PHP configuration for Laravel (development-friendly defaults)
; =============================================================================

[PHP]
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_time = 120
date.timezone = UTC

; Error reporting (override via APP_DEBUG in Laravel)
display_errors = Off
display_startup_errors = Off
log_errors = On

[Session]
session.cookie_httponly = 1
session.cookie_samesite = Lax
