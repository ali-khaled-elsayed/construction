# =============================================================================
# Production overlay — hardened runtime (no DB/Redis host ports, no debug)
# =============================================================================

services:
  mysql:
    ports: []

  redis:
    ports: []
    command: >
      sh -c "redis-server --requirepass $${REDIS_PASSWORD} --appendonly yes"

  backend:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
      - "${NGINX_API_PORT:-8000}:8000"
    volumes:
      - nginx_certs:/etc/nginx/certs:ro
    # Mount ssl.conf when certificates are ready:
    # - ./docker/nginx/conf.d/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  queue-worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 512M

  scheduler:
    environment:
      APP_ENV: production

volumes:
  nginx_certs:
